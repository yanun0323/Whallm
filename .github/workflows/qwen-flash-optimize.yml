name: Qwen Flash optimization

on:
  push:
    branches: [feat/qwen-flash-optimize]
  pull_request:
    branches: [master]
    paths:
      - 'runtime/**'
      - 'Scripts/*qwen*'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/qwen-flash-optimize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-flash-optimize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify host tests and syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          make test-qwen-flash-portable PYTHON=python 2>&1 | tee validation/portable.log
          python -m compileall -q runtime Scripts
          git diff --check
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-portable-validation
          path: validation/
          retention-days: 14

  mlx:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONPATH: runtime:.
      MLX_ENABLE_TF32: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Run Qwen integration suite on Metal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          python -u - <<'PY' 2>&1 | tee validation/mlx.log
          import json
          import os
          import platform
          import unittest
          from pathlib import Path
          from importlib.metadata import version
          import mlx.core as mx
          metadata = dict(platform=platform.platform(), machine=platform.machine(), mlx=version('mlx'), metal_available=mx.metal.is_available(), commit=os.environ['GITHUB_SHA'])
          print(metadata, flush=True)
          if not metadata['metal_available']:
              raise RuntimeError('Metal is unavailable; GPU validation cannot be reported as passing.')
          mx.set_default_device(mx.gpu)
          suite = unittest.defaultTestLoader.discover('runtime/tests', pattern='test_qwen*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          metadata.update(tests_run=result.testsRun, errors=len(result.errors), failures=len(result.failures), skipped=[dict(test=str(test), reason=reason) for test, reason in result.skipped], success=result.wasSuccessful(), full_model_benchmark=False)
          Path('validation/mlx-summary.json').write_text(json.dumps(metadata, indent=2) + '\n')
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Record synthetic row I/O, not model throughput
        run: make benchmark-qwen-flash-host PYTHON=python QWEN_FLASH_OUTPUT=validation/host-macos.json
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-mlx-validation
          path: validation/
          retention-days: 14
