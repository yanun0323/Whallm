name: Qwen next throughput

on:
  push:
    branches: [feat/qwen-flash-optimize]
    paths: ['.github/qsa-refinement.patch', '.github/workflows/qwen-next-throughput.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-next-throughput-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONPATH: runtime:.
      MLX_ENABLE_TF32: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed refinement
        run: |
          git apply --check .github/qsa-refinement.patch
          git apply .github/qsa-refinement.patch
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Validate Qwen and portable paths on Metal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          make test-qwen-flash-portable PYTHON=python 2>&1 | tee validation/portable.log
          python -u - <<'PY' 2>&1 | tee validation/qwen.log
          import json, os, platform, unittest
          from pathlib import Path
          from importlib.metadata import version
          import mlx.core as mx
          metadata = dict(commit=os.environ['GITHUB_SHA'], candidate_applied=True, platform=platform.platform(), mlx=version('mlx'), metal_available=mx.metal.is_available(), device=mx.device_info(), full_model_benchmark=False)
          if not metadata['metal_available']:
              raise RuntimeError('Metal unavailable; no CPU substitution.')
          mx.set_default_device(mx.gpu)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('runtime/tests', pattern='test_qwen*.py'))
          metadata.update(tests_run=result.testsRun, errors=len(result.errors), failures=len(result.failures), skipped=[dict(test=str(t), reason=r) for t,r in result.skipped], success=result.wasSuccessful())
          Path('validation/qwen-summary.json').write_text(json.dumps(metadata, indent=2) + '\n')
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Measure interleaved QSA components through 128k context
        shell: bash
        run: |
          set -euo pipefail
          python -u Scripts/benchmark_qwen_qsa_throughput.py --output validation/qsa.json 2>&1 | tee validation/qsa.log
      - name: Validate App controls, full Swift suite and runtime catalogs
        shell: bash
        run: |
          set -euo pipefail
          export WHALLM_QWEN_UI_ARTIFACTS="$GITHUB_WORKSPACE/validation"
          { swift --version; sw_vers; git rev-parse HEAD; } | tee validation/environment.log
          plutil -lint Sources/DeepSeekV4SSDApp/Resources/*.lproj/Localizable.strings
          make test 2>&1 | tee validation/swift.log
          python Scripts/validate_qwen_flash_app_catalog.py validation/catalogs 2>&1 | tee validation/catalog.log
          python -m compileall -q runtime Scripts
          git diff --check
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-next-validation
          path: validation/
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/qwen-flash-optimize'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish validated refinement and restore read-only checks
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git apply --check .github/qsa-refinement.patch
          git apply .github/qsa-refinement.patch
          test "$(git ls-remote origin refs/heads/feat/qwen-flash-optimize | cut -f1)" = "$EXPECTED_HEAD"
          git show 7e3ff70e1ba653fa07b106547868607e17fb4404:.github/workflows/qwen-next-throughput.yml > .github/workflows/qwen-next-throughput.yml
          git rm .github/qsa-refinement.patch
          git add runtime/deepseek_v4_ssd/qwen4_exp.py Scripts/benchmark_qwen_qsa_throughput.py runtime/tests/test_qwen_qsa_throughput.py .github/workflows/qwen-next-throughput.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(qwen): retain measured QSA paths and reject unhelpful gather rewrite'
          git push origin HEAD:refs/heads/feat/qwen-flash-optimize
