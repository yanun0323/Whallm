name: Qwen speed experiments

on:
  push:
    branches: [feat/qwen-flash-optimize]
    paths:
      - 'runtime/**'
      - 'Scripts/benchmark_qwen_speed.py'
      - 'Sources/**'
      - 'Tests/**'
      - 'requirements.txt'
      - '.github/workflows/qwen-speed.yml'
  pull_request:
    branches: [master]
    paths:
      - 'runtime/**'
      - 'Scripts/benchmark_qwen_speed.py'
      - '.github/workflows/qwen-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-speed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONPATH: runtime:.
      MLX_ENABLE_TF32: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Validate all Qwen paths on Metal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          python -u - <<'PY' 2>&1 | tee validation/qwen.log
          import json, os, platform, unittest
          from pathlib import Path
          from importlib.metadata import version
          import mlx.core as mx
          metadata = dict(commit=os.environ['GITHUB_SHA'], candidate_applied=False, platform=platform.platform(), mlx=version('mlx'), metal_available=mx.metal.is_available(), full_model_benchmark=False)
          if not metadata['metal_available']:
              raise RuntimeError('Metal is unavailable; GPU validation cannot pass.')
          mx.set_default_device(mx.gpu)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('runtime/tests', pattern='test_qwen*.py'))
          metadata.update(tests_run=result.testsRun, errors=len(result.errors), failures=len(result.failures), skipped=[dict(test=str(t), reason=r) for t,r in result.skipped], success=result.wasSuccessful())
          Path('validation/qwen-summary.json').write_text(json.dumps(metadata, indent=2) + '\n')
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Interleave baseline and candidate component timings
        shell: bash
        run: |
          set -euo pipefail
          python -u Scripts/benchmark_qwen_speed.py --output validation/speed.json 2>&1 | tee validation/speed.log
      - name: Validate full Swift suite and localized controls
        shell: bash
        run: |
          set -euo pipefail
          { swift --version; sw_vers; git rev-parse HEAD; } | tee validation/environment.log
          plutil -lint Sources/DeepSeekV4SSDApp/Resources/*.lproj/Localizable.strings
          make test 2>&1 | tee validation/swift.log
          python -m compileall -q runtime Scripts
          git diff --check
      - name: Preserve correctness and component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-speed-validation
          path: validation/
          retention-days: 14
