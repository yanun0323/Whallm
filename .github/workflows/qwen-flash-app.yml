name: Qwen Flash App controls

on:
  push:
    branches: [feat/qwen-flash-optimize]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'runtime/**'
      - 'Scripts/validate_qwen_flash_app_catalog.py'
      - 'Package.swift'
      - 'Package.resolved'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/qwen-flash-app.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'runtime/**'
      - 'Scripts/validate_qwen_flash_app_catalog.py'
      - 'Package.swift'
      - 'Package.resolved'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/qwen-flash-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-flash-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONPATH: runtime:.
      MLX_ENABLE_TF32: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned runtime for the catalog contract
        run: python -m pip install -r requirements.txt
      - name: Build and test the App, preferences, catalog, and localized controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          export WHALLM_QWEN_UI_ARTIFACTS="$GITHUB_WORKSPACE/validation"
          { swift --version; sw_vers; git rev-parse HEAD; } | tee validation/environment.log
          plutil -lint Sources/DeepSeekV4SSDApp/Resources/*.lproj/Localizable.strings
          git diff --check
          make test 2>&1 | tee validation/swift.log
      - name: Validate Swift catalogs with the actual Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/validate_qwen_flash_app_catalog.py validation/catalogs 2>&1 | tee validation/catalog.log
      - name: Preserve validation logs, catalog fixtures, and rendered controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-flash-app-validation
          path: validation/
          retention-days: 14
