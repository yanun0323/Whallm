name: Qwen Flash App controls

on:
  push:
    branches: [feat/qwen-flash-optimize]
    paths:
      - '.github/qwen-flash-ui-candidate/**'
      - '.github/workflows/qwen-flash-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-flash-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONPATH: runtime:.
      MLX_ENABLE_TF32: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply reviewed candidate
        run: python .github/qwen-flash-ui-candidate/apply.py
      - name: Install pinned runtime for the catalog contract
        run: python -m pip install -r requirements.txt
      - name: Build and test the App, preferences, catalog, and localized controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          export WHALLM_QWEN_UI_ARTIFACTS="$GITHUB_WORKSPACE/validation"
          { swift --version; sw_vers; git rev-parse HEAD; } | tee validation/environment.log
          plutil -lint Sources/DeepSeekV4SSDApp/Resources/*.lproj/Localizable.strings
          git diff --check
          make test 2>&1 | tee validation/swift.log
      - name: Validate Swift catalogs with the actual Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/validate_qwen_flash_app_catalog.py validation/catalogs 2>&1 | tee validation/catalog.log
      - name: Preserve validation logs, catalog fixtures, and rendered controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-flash-app-validation
          path: validation/
          retention-days: 14

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/qwen-flash-optimize'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish validated App controls without rewriting branch history
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/qwen-flash-ui-candidate/apply.py
          test "$(git ls-remote origin refs/heads/feat/qwen-flash-optimize | cut -f1)" = "$EXPECTED_HEAD"
          git rm -r .github/qwen-flash-ui-candidate
          git add Sources/DeepSeekV4SSDApp Tests/DeepSeekV4SSDAppTests \
            Scripts/validate_qwen_flash_app_catalog.py docs/qwen-flash-app-controls.md \
            docs/qwen-flash-optimization.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(app): expose opt-in Qwen Flash optimization controls'
          git push origin HEAD:refs/heads/feat/qwen-flash-optimize
