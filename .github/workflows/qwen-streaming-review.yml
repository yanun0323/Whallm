name: Qwen streaming review

on:
  push:
    branches: [feat/qwen-flash-optimize]
    paths:
      - 'runtime/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/*qwen*'
      - 'docs/qwen-streaming-review.md'
      - 'docs/validation/qwen-streaming-review-20260921.json'
      - '.github/workflows/qwen-streaming-review.yml'
  pull_request:
    branches: [master]
    paths:
      - 'runtime/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/*qwen*'
      - '.github/workflows/qwen-streaming-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-streaming-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve actual checked-out source
        run: |
          git archive --format=tar.gz --prefix=Whallm/ HEAD > Whallm-source.tar.gz
          git rev-parse HEAD > COMMIT.txt
          sha256sum Whallm-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-streaming-source
          path: |
            Whallm-source.tar.gz
            COMMIT.txt
            SHA256SUMS
          retention-days: 3
          if-no-files-found: error

  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONPATH: runtime:.
      MLX_ENABLE_TF32: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Validate Qwen, native I/O, cancellation and benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          make test-qwen-flash-portable PYTHON=python 2>&1 | tee validation/portable.log
          python -u - <<'PY' 2>&1 | tee validation/python.log
          import json, os, platform, unittest
          from pathlib import Path
          from importlib.metadata import version
          import mlx.core as mx
          from deepseek_v4_ssd.throughput_diagnostics import source_files_hash
          if not mx.metal.is_available():
              raise RuntimeError('Metal unavailable; no CPU substitution.')
          mx.set_default_device(mx.gpu)
          metadata = dict(commit=os.environ['GITHUB_SHA'], candidate_applied=False,
              source_files_sha256=source_files_hash(), platform=platform.platform(),
              mlx=version('mlx'), device=mx.device_info(), full_model_benchmark=False)
          loader = unittest.defaultTestLoader
          patterns = ['test_qwen*.py', 'test_throughput.py', 'test_prefill*.py',
                      'test_expert*.py', 'test_ssd_prefill*.py']
          suite = unittest.TestSuite(loader.discover('runtime/tests', pattern=p) for p in patterns)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          metadata.update(tests_run=result.testsRun, errors=len(result.errors), failures=len(result.failures),
              skipped=[dict(test=str(t), reason=r) for t,r in result.skipped], success=result.wasSuccessful())
          Path('validation/python-summary.json').write_text(json.dumps(metadata, indent=2) + '\n')
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Compare native expert bytes with equal cache budgets
        shell: bash
        run: |
          set -euo pipefail
          python -u Scripts/benchmark_qwen_streaming_io.py --output validation/streaming-io.json 2>&1 | tee validation/streaming-io.log
      - name: Validate full App suite, localized controls and runtime catalogs
        shell: bash
        run: |
          set -euo pipefail
          export WHALLM_QWEN_UI_ARTIFACTS="$GITHUB_WORKSPACE/validation"
          { swift --version; sw_vers; git rev-parse HEAD; } | tee validation/environment.log
          plutil -lint Sources/DeepSeekV4SSDApp/Resources/*.lproj/Localizable.strings
          make test 2>&1 | tee validation/swift.log
          python Scripts/validate_qwen_flash_app_catalog.py validation/catalogs 2>&1 | tee validation/catalog.log
          python -m compileall -q runtime Scripts
          git diff --check
          git diff --exit-code -- runtime Sources Tests Scripts docs
      - name: Preserve evidence, including negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-streaming-validation
          path: validation/
          retention-days: 14
          if-no-files-found: error
